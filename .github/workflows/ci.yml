name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: full

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Cache cargo & target directories
        uses: Swatinem/rust-cache@v2
        with:
          key: "v2"
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Build
        run: cargo build --verbose
      - name: Lint
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Build Docs
        run: cargo doc --verbose
      - name: Test
        run: cargo test --all-targets --all-features
      - name: Run standalone quick-start consumer
        run: python3 scripts/check-quickstart.py
      - name: Run self-contained example scenarios
        run: |
          for example in combinator_policy delegating_policy deny_override factsource_n_plus_one in_ram_rebac lookup_in_ram mfa_freshness_context policy_builder rbac_policy rebac_policy; do
            cargo run --example "$example" --all-features
          done

  postgres-contracts:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: gatehouse-test
          POSTGRES_DB: gatehouse_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gatehouse_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:gatehouse-test@localhost:5432/gatehouse_test
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test PostgreSQL bulk ordering and fixture isolation
        run: cargo test --example postgres_bulk_rebac --all-features -- --ignored
      - name: Run PostgreSQL example scenarios
        run: cargo run --example postgres_bulk_rebac --all-features

  feature-contracts:
    name: Feature contracts (${{ matrix.features.name }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        features:
          - name: none
            args: --no-default-features
          - name: tracing
            args: --no-default-features --features tracing
          - name: serde
            args: --no-default-features --features serde
          - name: all
            args: --all-features
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check library dependency graph
        if: matrix.features.name == 'none'
        run: |
          cargo tree --edges normal --no-default-features > dependencies.txt
          if grep -q tracing dependencies.txt; then
            cat dependencies.txt
            exit 1
          fi
      - name: Lint
        run: cargo clippy --all-targets ${{ matrix.features.args }} -- -D warnings
      - name: Test contracts and examples
        run: cargo test --lib --tests --examples ${{ matrix.features.args }}
      - name: Test documentation
        run: cargo test --doc ${{ matrix.features.args }}

  msrv:
    name: Minimum supported Rust (1.82)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.82.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --lib --all-features --locked
      - run: cargo check --lib --no-default-features --locked

  loom-tests:
    name: Loom permutation tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Cache cargo & target directories
        uses: Swatinem/rust-cache@v2
        with:
          key: "loom-v1"
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      # Loom-incompatible dev-deps are gated on `cfg(not(loom))` in Cargo.toml,
      # so this build collapses to just the library + loom. The harness lives
      # in `src/session/core.rs` (see #29).
      - name: Run loom models
        run: cargo test --lib --release
        env:
          RUSTFLAGS: "--cfg loom"

  mutation-tests:
    name: Mutation tests
    needs: build-and-test
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Cache cargo & target directories
        uses: Swatinem/rust-cache@v2
        with:
          key: "mutants-v1"
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-mutants
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants
      - name: Capture authorization diff
        run: git diff origin/${{ github.base_ref }}...HEAD -- src/builder.rs src/checker.rs src/combinators.rs src/capability.rs src/policies/delegating.rs > mutants.diff
      - name: Run focused mutation tests
        run: >
          cargo mutants
          --jobs=2
          --jobserver-tasks=2
          --in-diff=mutants.diff
          --file src/builder.rs
          --file src/checker.rs
          --file src/combinators.rs
          --file src/capability.rs
          --file src/policies/delegating.rs
          --timeout=60
          --build-timeout=300
          --all-features
          --
          --lib
          --test checker_contract
          --test tracing_contract
          --test outcome_contract
      - name: Upload mutation test report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mutants-out
          path: mutants.out
